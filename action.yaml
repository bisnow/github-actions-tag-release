name: 'Find and tag most recent image'
description: 'Finds most recent commit with image built and tags it with v* tag'
inputs:
  tag:
    description: 'v* tag to use when tagging image'
    required: true
  ECR_REGISTRY:
    description: 'AWS ECR registry where images are. Provide this OR HARBOR_REGISTRY.'
    required: false
    default: ''
  HARBOR_REGISTRY:
    description: 'Harbor registry where images are (e.g. harbor.bisnow.cloud/bisnow/my-service). Provide this OR ECR_REGISTRY.'
    required: false
    default: ''
  only-harbor:
    description: 'Use only Harbor, no ECR'
    required: false
    type: boolean
    default: false
  aws-account:
    description: 'Aws account to assume'
    required: false
    default: 'bisnow'
  aws-region:
    description: 'aws region where ECR repo is'
    required: false
    default: 'us-east-1'
  build-workflow:
    description: 'Filename of the build workflow to wait for'
    required: false
    default: 'build.yml'

outputs:
  git_sha: 
    description: 'Git SHA that was tagged'
    value: ${{ steps.find_image_commit.outputs.git_sha }}
  dev_tag:
    description: 'Dev or RC tag found'
    value: ${{ steps.find_image_commit.outputs.dev_tag }}

runs:
  using: 'composite'
  steps:
    - name: Wait for build to complete on this commit
      id: wait-for-build
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        SKIP_RE='\[(skip ci|ci skip|no ci|skip actions|actions skip)\]|(^|[[:space:]])skip-checks:[[:space:]]*true'
        WAIT_SHA="${{ github.sha }}"
        for hop in $(seq 1 10); do
          # Prefer a real build run over the commit-message hint. A skip-CI
          # marker only tells us GitHub *might* have suppressed the push
          # trigger - it does not mean no build exists. A manually
          # dispatched build on this SHA is just as valid as a push build.
          RUN=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow=${{ inputs.build-workflow }} \
            --commit=$WAIT_SHA \
            --limit 1 \
            --json status,conclusion \
            --jq '.[0]')
          if [[ -n "$RUN" && "$RUN" != "null" ]]; then
            echo "Found build run for $WAIT_SHA - will wait on this commit."
            break
          fi

          COMMIT_MSG=$(gh api repos/${{ github.repository }}/commits/$WAIT_SHA --jq '.commit.message')
          if echo "$COMMIT_MSG" | grep -qE "$SKIP_RE"; then
            PARENT=$(gh api repos/${{ github.repository }}/commits/$WAIT_SHA --jq '.parents[0].sha')
            echo "No build run for $WAIT_SHA and commit has skip-CI markers; walking back to parent: $PARENT"
            WAIT_SHA="$PARENT"
            continue
          fi
          break
        done

        echo "Waiting for build workflow on commit $WAIT_SHA..."
        for i in $(seq 1 60); do
          result=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow=${{ inputs.build-workflow }} \
            --commit=$WAIT_SHA \
            --limit 100 \
            --json status,conclusion \
            --jq '.[0]')

          if [[ -z "$result" || "$result" == "null" ]]; then
            echo "No build run found yet, retrying... ($i/60)"
            sleep 30
            continue
          fi

          status=$(echo "$result" | jq -r '.status')
          conclusion=$(echo "$result" | jq -r '.conclusion')
          echo "Build status: $status, conclusion: $conclusion"

          if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
            echo "✅ Build completed successfully."
            echo "build_sha=$WAIT_SHA" >> $GITHUB_OUTPUT
            exit 0
          elif [[ "$status" == "completed" ]]; then
            echo "❌ Build did not succeed (conclusion: $conclusion). Aborting tag."
            exit 1
          fi

          echo "Still in progress, retrying in 30s... ($i/60)"
          sleep 30
        done
        echo "❌ Timed out after 30 minutes waiting for build."
        exit 1

    - name: Validate tag format
      id: validate
      shell: bash
      run: |
        TAG="${{ inputs.tag }}"
        echo "tag=$TAG" >> $GITHUB_OUTPUT

        # Check if tag starts with 'v' and follows semantic versioning pattern
        if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
          echo "is_valid=true" >> $GITHUB_OUTPUT
          echo "✅ Valid tag format: $TAG"
        else
          echo "is_valid=false" >> $GITHUB_OUTPUT
          echo "❌ Invalid tag format: $TAG"
          echo "Tag must start with 'v' and follow semantic versioning (e.g., v1.0.0)"
          exit 1
        fi

    - name: Validate registry inputs
      shell: bash
      run: |
        if [ -z "${{ inputs.ECR_REGISTRY }}" ] && [ -z "${{ inputs.HARBOR_REGISTRY }}" ]; then
          echo "❌ You must provide either ECR_REGISTRY or HARBOR_REGISTRY"
          exit 1
        fi
        if [ "${{ inputs.only-harbor }}" == "true" ] && [ -z "${{ inputs.HARBOR_REGISTRY }}" ]; then
          echo "❌ only-harbor is true but HARBOR_REGISTRY was not provided"
          exit 1
        fi

    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Assume role for AWS Account
      if: ${{ inputs.only-harbor != 'true' }}
      uses: bisnow/github-actions-assume-role-for-environment@main
      with:
        aws-account: ${{ inputs.aws-account }}

    - name: Save Harbor credentials
      if: ${{ inputs.only-harbor == 'true' }}
      id: harbor-creds
      shell: bash
      run: |
        if [ -f /home/runner/.docker/config.json ]; then
          HARBOR_PASSWORD=$(python3 -c "import json; c=json.load(open('/home/runner/.docker/config.json')); print(c['auths']['harbor.bisnow.cloud']['password'])")
          echo "::add-mask::${HARBOR_PASSWORD}"
          echo "password=${HARBOR_PASSWORD}" >> $GITHUB_OUTPUT
        else
          echo "::error::No Docker config found at /home/runner/.docker/config.json — Harbor credentials unavailable"
          exit 1
        fi

    - name: Login to Harbor
      if: ${{ inputs.only-harbor == 'true' }}
      shell: bash
      run: |
        echo "${{ steps.harbor-creds.outputs.password }}" | docker login harbor.bisnow.cloud -u 'robot$arc-cicd' --password-stdin

    - name: Find Image for Build Commit
      id: find_image_commit
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        GIT_SHA="${{ steps.wait-for-build.outputs.build_sha }}"
        ONLY_HARBOR="${{ inputs.only-harbor }}"
        MAX_HOPS=20

        if [ "$ONLY_HARBOR" == "true" ]; then
          # harbor.bisnow.cloud/<project>/<repo...>
          HARBOR_PATH="${{ inputs.HARBOR_REGISTRY }}"
          HARBOR_PATH="${HARBOR_PATH#harbor.bisnow.cloud/}"
          HARBOR_PROJECT="${HARBOR_PATH%%/*}"
          HARBOR_REPO="${HARBOR_PATH#*/}"
          # URL-encode any '/' in a multi-segment repo name for the Harbor API
          HARBOR_REPO_ENC="${HARBOR_REPO//\//%2F}"
          HARBOR_PASSWORD="${{ steps.harbor-creds.outputs.password }}"
        else
          REPO_NAME="${{ inputs.ECR_REGISTRY }}"
          REPO_NAME="${REPO_NAME#*/}"
        fi

        # Returns 0 if an image tagged with $1 exists in the active registry.
        image_exists() {
          if [ "$ONLY_HARBOR" == "true" ]; then
            docker manifest inspect "${{ inputs.HARBOR_REGISTRY }}:$1" >/dev/null 2>&1
          else
            aws ecr describe-images --repository-name "$REPO_NAME" --image-ids imageTag=$1 --region ${{ inputs.aws-region }} >/dev/null 2>&1
          fi
        }

        # Walk back through commit parents until we find one with an image.
        # The build workflow may have been skipped (e.g. no source changes)
        # or only updated k8s manifests, so the tagged commit itself may not
        # have an image even when its build run reports success.
        for hop in $(seq 1 $MAX_HOPS); do
          echo "🔍 Looking up image for commit: $GIT_SHA (hop $hop/$MAX_HOPS)"
          if image_exists "$GIT_SHA"; then
            echo "✅ Found image for commit: $GIT_SHA"
            break
          fi
          PARENT=$(gh api repos/${{ github.repository }}/commits/$GIT_SHA --jq '.parents[0].sha' 2>/dev/null || echo "")
          if [ -z "$PARENT" ] || [ "$PARENT" == "null" ]; then
            echo "❌ No image found and no parent commit available — aborting."
            exit 1
          fi
          echo "⚠️ No image for $GIT_SHA, walking back to parent: $PARENT"
          GIT_SHA="$PARENT"
        done

        # Final verification: loop may have exhausted MAX_HOPS without
        # finding an image.
        if ! image_exists "$GIT_SHA"; then
          echo "❌ Exhausted $MAX_HOPS hops walking back commits without finding an image."
          exit 1
        fi

        # Find the dev/rc tag that shares this image, so it can be re-pointed
        # alongside the release tag.
        if [ "$ONLY_HARBOR" == "true" ]; then
          # Read the artifact (with its tags) referenced by the SHA tag. Uses
          # the "read artifact" permission the arc-cicd robot already holds —
          # the /artifacts/{ref}/tags endpoint needs "list tag", which it does
          # not. Surface API failures instead of silently finding no tag.
          API_URL="https://harbor.bisnow.cloud/api/v2.0/projects/$HARBOR_PROJECT/repositories/$HARBOR_REPO_ENC/artifacts/$GIT_SHA?with_tag=true&page_size=100"
          RESP=$(curl -s -w $'\n%{http_code}' -u "robot\$arc-cicd:$HARBOR_PASSWORD" "$API_URL")
          HTTP_CODE=$(printf '%s' "$RESP" | tail -n1)
          BODY=$(printf '%s' "$RESP" | sed '$d')
          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️ Harbor artifact API returned HTTP $HTTP_CODE — cannot resolve dev/rc tag"
            echo "   URL: $API_URL"
            echo "   Response: $BODY"
            DEV_TAG=""
          else
            echo "🏷️  Harbor tags on $GIT_SHA: $(printf '%s' "$BODY" | jq -rc '[.tags[]?.name]')"
            DEV_TAG=$(printf '%s' "$BODY" | jq -r '.tags[]?.name' | grep -oE '(dev|rc)-[0-9]+' | head -1 || true)
          fi
        else
          DEV_TAG=$(aws ecr describe-images --repository-name "$REPO_NAME" --image-ids imageTag=$GIT_SHA --region ${{ inputs.aws-region }} --query 'imageDetails[0].imageTags' --output text | grep -oE '(dev|rc)-[0-9]+' | head -1 || true)
        fi

        if [ -n "$DEV_TAG" ]; then
          echo "📦 Found associated dev/rc tag: $DEV_TAG"
        else
          echo "⚠️ No dev/rc tag found for this commit"
        fi

        echo "git_sha=$GIT_SHA" >> $GITHUB_OUTPUT
        echo "dev_tag=$DEV_TAG" >> $GITHUB_OUTPUT

    - name: Login to Amazon ECR
      if: ${{ inputs.only-harbor != 'true' }}
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Tag Image with Release Tag
      shell: bash
      run: |
        set -e  # Exit on any error

        # Resolve the active registry
        if [ "${{ inputs.only-harbor }}" == "true" ]; then
          REGISTRY="${{ inputs.HARBOR_REGISTRY }}"
        else
          REGISTRY="${{ inputs.ECR_REGISTRY }}"
        fi

        # Create and push the release tag
        RELEASE_TAG="${{ inputs.tag }}"
        GIT_SHA="${{ steps.find_image_commit.outputs.git_sha }}"
        DEV_TAG="${{ steps.find_image_commit.outputs.dev_tag }}"

        echo "Creating release manifest based on most recent commit with image"
        echo "Registry: $REGISTRY"
        echo "Git SHA: $GIT_SHA"
        echo "Dev/RC tag: $DEV_TAG"
        echo "Release tag: $RELEASE_TAG"

        # Create a new multi-platform manifest that includes both dev and release tags
        # This creates a manifest with both tags pointing to the same image content
        if [ -n "$DEV_TAG" ]; then
          echo "Creating manifest with dev/rc tag and release tag..."
          docker buildx imagetools create \
            --tag $REGISTRY:$DEV_TAG \
            --tag $REGISTRY:$RELEASE_TAG \
            $REGISTRY:$GIT_SHA
        else
          echo "Creating manifest with only release tag (no dev/rc tag found)..."
          docker buildx imagetools create \
            --tag $REGISTRY:$RELEASE_TAG \
            $REGISTRY:$GIT_SHA
        fi

        # Verify the manifest was created successfully
        echo "Verifying release manifest was created..."
        docker buildx imagetools inspect $REGISTRY:$RELEASE_TAG

        echo "✅ Successfully created release manifest"
        echo "Release tag: $REGISTRY:$RELEASE_TAG"
        if [ -n "$DEV_TAG" ]; then
          echo "Dev/RC tag: $REGISTRY:$DEV_TAG"
        fi
        echo "Based on Git SHA: $GIT_SHA"
        echo "Commit offset: ${{ steps.find_image_commit.outputs.commit_offset }}"

    - name: Create GitHub Summary
      shell: bash
      run: |
        GIT_SHA="${{ steps.find_image_commit.outputs.git_sha }}"
        DEV_TAG="${{ steps.find_image_commit.outputs.dev_tag }}"
        RELEASE_TAG="${{ inputs.tag }}"
        COMMIT_OFFSET="${{ steps.find_image_commit.outputs.commit_offset }}"
        if [ "${{ inputs.only-harbor }}" == "true" ]; then
          REGISTRY="${{ inputs.HARBOR_REGISTRY }}"
        else
          REGISTRY="${{ inputs.ECR_REGISTRY }}"
        fi
        ACCOUNT_ID=$(echo "${{ inputs.ECR_REGISTRY }}" | cut -d. -f1)
        REPO_NAME="${REGISTRY#*/}"

        # Get commit message and author
        COMMIT_MSG=$(git log -1 --pretty=format:'%s' $GIT_SHA)
        COMMIT_AUTHOR=$(git log -1 --pretty=format:'%an' $GIT_SHA)
        COMMIT_DATE=$(git log -1 --pretty=format:'%ar' $GIT_SHA)
        
        # Create summary
        cat >> $GITHUB_STEP_SUMMARY << 'EOF'
        # Release Tagged Successfully
        
        ## Release Information
        EOF
        echo "- **Release Tag**: \`$RELEASE_TAG\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Registry**: \`$REGISTRY\`" >> $GITHUB_STEP_SUMMARY
        cat >> $GITHUB_STEP_SUMMARY << 'EOF'

        ## Which Commit Was Tagged?
        This action searched backwards through your recent commits to find the **most recent commit with a successfully built Docker image** in the registry.

        ### Commit Details
        EOF
        echo "- **Git SHA**: \`$GIT_SHA\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit Message**: $COMMIT_MSG" >> $GITHUB_STEP_SUMMARY
        echo "- **Author**: $COMMIT_AUTHOR" >> $GITHUB_STEP_SUMMARY
        echo "- **Committed**: $COMMIT_DATE" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Add dev/rc tag info if available
        if [ -n "$DEV_TAG" ]; then
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
        ## Associated Tags
        EOF
          echo "- **Dev/RC Tag**: \`$DEV_TAG\`" >> $GITHUB_STEP_SUMMARY
        else
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
        ## Associated Tags
        - No dev/rc tag found for this commit
        EOF
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Add debugging links
        cat >> $GITHUB_STEP_SUMMARY << 'EOF'
        ## Debugging Links
        EOF
        echo "- [View Commit on GitHub](${{ github.server_url }}/${{ github.repository }}/commit/$GIT_SHA)" >> $GITHUB_STEP_SUMMARY
        if [ "${{ inputs.only-harbor }}" == "true" ]; then
          echo "- [View Harbor Images](https://$REGISTRY)" >> $GITHUB_STEP_SUMMARY
        else
          echo "- [View ECR Images](https://console.aws.amazon.com/ecr/repositories/private/$ACCOUNT_ID/$REPO_NAME?region=${{ inputs.aws-region }})" >> $GITHUB_STEP_SUMMARY
        fi
        cat >> $GITHUB_STEP_SUMMARY << 'EOF'
        
        ## Tagged Images
        The following images now point to the same manifest:
        EOF
        echo "- \`$REGISTRY:$GIT_SHA\` (original SHA tag)" >> $GITHUB_STEP_SUMMARY
        echo "- \`$REGISTRY:$RELEASE_TAG\` (release tag)" >> $GITHUB_STEP_SUMMARY
        if [ -n "$DEV_TAG" ]; then
          echo "- \`$REGISTRY:$DEV_TAG\` (dev/rc tag)" >> $GITHUB_STEP_SUMMARY
        fi